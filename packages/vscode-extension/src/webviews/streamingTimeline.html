<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming Timeline</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            background: var(--vscode-editor-background);
            color: var(--vscode-editor-foreground);
            padding: 12px;
            margin: 0;
            line-height: 1.5;
        }

        .timeline-container {
            max-width: 100%;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--vscode-editorGroup-border);
        }

        .timeline-title {
            font-weight: 600;
            font-size: 13px;
        }

        .timeline-stats {
            display: flex;
            gap: 16px;
            font-size: 11px;
            color: var(--vscode-descriptionForeground);
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .stat-value {
            font-weight: 600;
            font-size: 12px;
            color: var(--vscode-editor-foreground);
        }

        .stat-label {
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .timeline-events {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .timeline-event {
            background: var(--vscode-editorGroup-border);
            border-left: 3px solid var(--vscode-progressBar-background);
            border-radius: 2px;
            padding: 8px 12px;
            font-size: 12px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .event-icon {
            display: inline-block;
            margin-right: 6px;
            width: 16px;
        }

        .event-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .event-description {
            color: var(--vscode-descriptionForeground);
            font-size: 11px;
            margin-bottom: 4px;
        }

        .event-meta {
            display: flex;
            gap: 12px;
            font-size: 10px;
            color: var(--vscode-descriptionForeground);
        }

        .event-tokens {
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }

        .token-badge {
            background: rgba(76, 175, 80, 0.2);
            color: var(--vscode-testing-runAction);
            padding: 1px 4px;
            border-radius: 2px;
            font-weight: 500;
        }

        .event-cost {
            color: var(--vscode-editor-foreground);
        }

        .event-time {
            color: var(--vscode-descriptionForeground);
        }

        .event.thinking {
            border-left-color: #FFB400;
        }

        .event.thinking .event-icon::before {
            content: '🧠';
        }

        .event.tool_use {
            border-left-color: #2196F3;
        }

        .event.tool_use .event-icon::before {
            content: '🔧';
        }

        .event.response {
            border-left-color: #4CAF50;
        }

        .event.response .event-icon::before {
            content: '💭';
        }

        .event.edit {
            border-left-color: #9C27B0;
        }

        .event.edit .event-icon::before {
            content: '✏️';
        }

        .event.success {
            border-left-color: #4CAF50;
        }

        .event.success .event-icon::before {
            content: '✅';
        }

        .event.error {
            border-left-color: #F44336;
        }

        .event.error .event-icon::before {
            content: '❌';
        }

        .loading-spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid var(--vscode-progressBar-background);
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-right: 4px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .token-tracker {
            background: var(--vscode-input-background);
            border: 1px solid var(--vscode-editorGroup-border);
            border-radius: 4px;
            padding: 8px 12px;
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
        }

        .token-count {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .progress-bar {
            flex: 1;
            height: 4px;
            background: var(--vscode-editorGroup-border);
            border-radius: 2px;
            overflow: hidden;
            margin: 0 12px;
        }

        .progress-fill {
            height: 100%;
            background: var(--vscode-progressBar-background);
            width: 0%;
            transition: width 0.3s;
        }

        .cancel-button {
            background: var(--vscode-statusBarItem-errorBackground);
            color: var(--vscode-statusBarItem-errorForeground);
            border: none;
            border-radius: 3px;
            padding: 4px 8px;
            font-size: 10px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .cancel-button:hover {
            opacity: 0.8;
        }

        .no-events {
            color: var(--vscode-descriptionForeground);
            text-align: center;
            padding: 20px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="timeline-container">
        <div class="timeline-header">
            <div class="timeline-title">🤖 Agent Timeline</div>
            <button class="cancel-button" onclick="cancelMission()">Cancel</button>
        </div>

        <div class="timeline-stats">
            <div class="stat">
                <div class="stat-value" id="tokenCount">0</div>
                <div class="stat-label">Tokens</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="costValue">$0.00</div>
                <div class="stat-label">Cost</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="elapsedTime">0s</div>
                <div class="stat-label">Elapsed</div>
            </div>
        </div>

        <div class="timeline-events" id="eventsContainer">
            <div class="no-events">Waiting for agent response...</div>
        </div>

        <div class="token-tracker">
            <div class="token-count">
                <span id="tokenRate">0 tokens/s</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div id="eta">--:-- remaining</div>
        </div>
    </div>

    <script>
        const vscode = acquireVsCodeApi();
        let events = [];
        let totalTokens = 0;
        let totalCost = 0;
        let startTime = Date.now();
        let maxTokens = 5000;

        function formatCost(cost) {
            return '$' + cost.toFixed(4);
        }

        function formatTokens(tokens) {
            if (tokens < 1000) return tokens;
            if (tokens < 1000000) return (tokens / 1000).toFixed(1) + 'K';
            return (tokens / 1000000).toFixed(2) + 'M';
        }

        function getEventIcon(type) {
            const icons = {
                'thinking': '🧠',
                'tool_use': '🔧',
                'response': '💭',
                'edit': '✏️',
                'success': '✅',
                'error': '❌'
            };
            return icons[type] || '•';
        }

        function addEvent(event) {
            events.push(event);
            updateTimeline();
        }

        function updateTimeline() {
            const container = document.getElementById('eventsContainer');

            if (events.length === 0) {
                container.innerHTML = '<div class="no-events">Waiting for agent response...</div>';
                return;
            }

            container.innerHTML = events.map(e => {
                const elapsed = e.timestamp ? new Date(e.timestamp).toLocaleTimeString() : '';
                const eventClass = e.type.replace('.', ' ');

                return \`
                    <div class="timeline-event event \${eventClass}">
                        <div class="event-title">\${getEventIcon(e.type)} \${e.title}</div>
                        <div class="event-description">\${e.description || ''}</div>
                        <div class="event-meta">
                            <span class="event-time">\${elapsed}</span>
                            \${e.tokenUsage ? \`<span class="event-tokens"><span class="token-badge">\${e.tokenUsage.totalTokens} tokens</span></span>\` : ''}
                            \${e.cost ? \`<span class="event-cost">\${formatCost(e.cost)}</span>\` : ''}
                        </div>
                    </div>
                \`;
            }).join('');
        }

        function updateStats() {
            document.getElementById('tokenCount').textContent = formatTokens(totalTokens);
            document.getElementById('costValue').textContent = formatCost(totalCost);

            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('elapsedTime').textContent = elapsed + 's';

            const tokensPerSec = elapsed > 0 ? (totalTokens / elapsed).toFixed(1) : 0;
            document.getElementById('tokenRate').textContent = tokensPerSec + ' tokens/s';

            const progress = Math.min((totalTokens / maxTokens) * 100, 100);
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function recordTokenUsage(inputTokens, outputTokens, totalTokens, cost) {
            totalTokens += totalTokens;
            totalCost += cost;
            updateStats();
        }

        function cancelMission() {
            vscode.postMessage({ type: 'cancelMission' });
        }

        window.addEventListener('message', (event) => {
            const message = event.data;

            if (message.type === 'addTimelineEvent') {
                addEvent(message.event);
            } else if (message.type === 'recordTokenUsage') {
                recordTokenUsage(message.inputTokens, message.outputTokens, message.totalTokens, message.cost);
            } else if (message.type === 'updateProgress') {
                maxTokens = message.maxTokens || maxTokens;
                updateStats();
            }
        });

        // Update stats every second
        setInterval(updateStats, 1000);
        updateStats();
    </script>
</body>
</html>
