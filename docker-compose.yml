services:
  server:
    image: ${IMAGE_PREFIX:-ghcr.io/bjo163/a-l-l-a-h.com}-server:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:5150:5150"
    environment:
      - LOCO_ENV=production
      - PORT=5150
      - BINDING=0.0.0.0
      - DATABASE_URL=sqlite:///app/data/moonwitness.sqlite?mode=rwc
    volumes:
      - server_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5150/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/bjo163/a-l-l-a-h.com}-web:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://server:5150
    depends_on:
      server:
        condition: service_started

volumes:
  server_data:
