services:
  arsy:
    build:
      context: .
      dockerfile: apps/arsy/Dockerfile
    restart: unless-stopped
    ports:
      - "5150:5150"
    environment:
      - PORT=5150
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET:-arsy-master-secret-key}
    volumes:
      - arsy_data:/app/data

  dock:
    build:
      context: .
      dockerfile: apps/dock/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NEXT_PUBLIC_ARSY_API_URL=http://localhost:5150
    depends_on:
      - arsy

  headquarter:
    build:
      context: .
      dockerfile: apps/headquarter/Dockerfile
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NEXT_PUBLIC_ARSY_API_URL=http://localhost:5150
    depends_on:
      - arsy

  id:
    build:
      context: .
      dockerfile: apps/id/Dockerfile
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - NEXT_PUBLIC_ARSY_API_URL=http://localhost:5150
    depends_on:
      - arsy

volumes:
  arsy_data:

