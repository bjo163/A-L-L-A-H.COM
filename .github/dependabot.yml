version: 2
updates:
  # npm/pnpm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # Ignore major version updates for these packages
      - dependency-name: "next"
        update-type: "version-update:semver-major"
      - dependency-name: "react"
        update-type: "version-update:semver-major"
      - dependency-name: "react-dom"
        update-type: "version-update:semver-major"
      - dependency-name: "typescript"
        update-type: "version-update:semver-major"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    reviewers:
      - "bjo163"
    assignees:
      - "bjo163"
    auto-merge:
      enabled: true
      merge-type: "squash"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
    reviewers:
      - "bjo163"
    assignees:
      - "bjo163"
    auto-merge:
      enabled: true
      merge-type: "squash"

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
    reviewers:
      - "bjo163"
    assignees:
      - "bjo163"
