name: Feature Request
description: Propose new capability or product direction.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today, and who feels it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The capability being asked for, behaviour first not implementation.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Measurable outcomes; name the files or subsystems that must change.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else could solve this, and why it was not chosen.
    validations:
      required: false
