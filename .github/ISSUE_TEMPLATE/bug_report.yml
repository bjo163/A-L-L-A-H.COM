name: Bug Report
description: Report a defect in behaviour, build, or deployment.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What breaks, in one or two sentences.
      placeholder: The hub returns 500 on POST /v1/works when company_id is missing.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduce
      description: Exact command or click path, plus the observed output.
      value: |
        1.
        2.
        3.
        Observed:
        Expected:
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Log lines, failing test output, file paths. Paste verbatim.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - apps/arsy
        - apps/gate
        - apps/dock
        - apps/headquarter
        - apps/id
        - apps/jizz
        - apps/moonsky
        - apps/harbor
        - apps/sentinel
        - addons
        - packages/ui
        - packages/sdk
        - CI / deploy
        - Other
    validations:
      required: true
