name: CI Validation Gate & Promotion

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-dev-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Required quality gates
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Start gate timing summary
        run: echo '| Gate | Duration | Exit |' >> "$GITHUB_STEP_SUMMARY" && echo '|---|---:|---:|' >> "$GITHUB_STEP_SUMMARY"
      - name: Install dependencies
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'Frozen lockfile install' pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .cache/typecheck
          key: typecheck-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            typecheck-${{ runner.os }}-${{ github.ref_name }}-
            typecheck-${{ runner.os }}-
      - id: changes
        name: Select affected build targets
        env:
          BUILD_AFFECTED_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/select-affected-builds.mjs >> "$GITHUB_OUTPUT"
      - name: Documentation contract
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'Documentation contract' pnpm docs:check
      - name: Unit contract consistency
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'Unit contract consistency' pnpm contract:check
      - name: Contract index freshness
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'Contract index freshness' pnpm contract:index:check
      - name: Architecture invariants
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'Architecture invariants' pnpm lint:arch
      - name: Affected build selector tests
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'Affected build selector' pnpm build:affected:test
      - name: Affected TypeScript selector tests
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'Affected TypeScript selector' pnpm typecheck:affected:test
      - name: Workspace scaffold validation
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'Workspace scaffolds' node scripts/validate-workspace-scaffolds.mjs
      - name: ESLint
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'ESLint' pnpm lint
      - name: TypeScript
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'TypeScript' pnpm typecheck
      - name: VS Code extension tests
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'Extension tests' pnpm extension:test
      - name: Arsy tests
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'Arsy tests' pnpm --filter @allah/arsy test
      - name: Verify harbor
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'Verify harbor' pnpm harbor:build
      - name: Verify moonsky
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'Verify moonsky' pnpm moonsky:build
      - name: Build arsy
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'Build arsy' pnpm --filter @allah/arsy build
        # run: pnpm --filter @allah/arsy build
      - name: Build dock
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'Build dock' pnpm dock:build
        # run: pnpm dock:build
      - name: Build e-isp
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'Build e-isp' pnpm esp:build
        # run: pnpm esp:build
      - name: Build gate
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'Build gate' pnpm gate:build
        # run: pnpm gate:build
      - name: Build harbor
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'Build harbor' pnpm harbor:build
        # run: pnpm harbor:build
      - name: Build headquarter
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'Build headquarter' pnpm headquarter:build
        # run: pnpm headquarter:build
      - name: Build id
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'Build id' pnpm id:build
        # run: pnpm id:build
      - name: Build jizz
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'Build jizz' pnpm jizz:build
        # run: pnpm jizz:build
      - name: Build moonsky
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'Build moonsky' pnpm moonsky:build
        # run: pnpm moonsky:build
      - name: Build sentinel
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'Build sentinel' pnpm sentinel:build
        # run: pnpm sentinel:build
      - name: Design system tests
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'UI tests' pnpm ui:test
      - name: Skin contrast
        env:
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs 'UI contrast' pnpm ui:contrast
      - name: Upload quality gate timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-timings-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate-timings.jsonl
          if-no-files-found: ignore
          retention-days: 30

  build:
    name: Build ${{ matrix.component }}
    needs: verify
    if: needs.verify.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.verify.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Next.js build cache
        if: matrix.cachePath != ''
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cachePath }}
          key: next-${{ matrix.component }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', format('apps/{0}/**', matrix.component), 'packages/ui/src/**', 'packages/types/src/**', 'packages/sdk/src/**') }}
          restore-keys: |
            next-${{ matrix.component }}-${{ runner.os }}-
      - name: Build selected component
        env:
          BUILD_COMPONENT: ${{ matrix.component }}
          GATE_TIMINGS_FILE: ${{ runner.temp }}/gate-timings.jsonl
        run: node scripts/run-gate.mjs "Build $BUILD_COMPONENT" node scripts/build-one.mjs
      - name: Upload build timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-timing-${{ matrix.component }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate-timings.jsonl
          if-no-files-found: ignore
          retention-days: 30

  promote-to-main:
    name: Promote dev to main
    needs: [verify, verify-harbor, verify-moonsky, build]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/dev' &&
      needs.verify.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main || git checkout -b main origin/main
          git merge --ff-only dev
          git push origin main
      - name: Start production publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish-deploy.yml --ref main
