name: CI Validation Gate & Promotion

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-dev-gate
  cancel-in-progress: false

jobs:
  verify-server:
    name: Verify Loco Rust Server
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/server

      - name: Cargo Check
        run: cargo check --manifest-path apps/server/Cargo.toml

      - name: Cargo Test
        run: cargo test --manifest-path apps/server/Cargo.toml

  verify-web:
    name: Verify Next.js Web
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web App
        run: pnpm web:build

  verify-extension:
    name: Verify VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Extension
        run: pnpm extension:build

  promote-to-main:
    name: Promote dev to main
    runs-on: ubuntu-latest
    needs: [verify-server, verify-web, verify-extension]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    steps:
      - name: Check out dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward main to dev
        run: |
          git checkout main || git checkout -b main origin/main
          git merge --ff-only dev
          git push origin main
