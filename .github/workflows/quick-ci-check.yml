name: Quick CI Health Check

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  issues: write

jobs:
  quick-check:
    name: Quick Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      
      - run: pnpm install --frozen-lockfile
      
      - name: TypeCheck
        run: pnpm typecheck
        continue-on-error: true
      
      - name: Lint Arch
        run: pnpm lint:arch
        continue-on-error: true
      
      - name: Build Gate
        run: pnpm --filter @moonwitness/gate build
        continue-on-error: true
      
      - name: Create issue on failure
        if: failure()
        uses: peter-evans/create-issue-from-file@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "[Quick Check Failed] Pre-push validation failed on ${{ github.ref_name }}"
          content-filepath: .github/issue-templates/ci-failure.md
          labels: |
            ci-failure
            auto-created
            quick-check
            branch:${{ github.ref_name }}
          assignees: |
        env:
          WORKFLOW_NAME: "Quick CI Health Check"
          RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: "https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          RUN_STARTED: ${{ github.event.repository.updated_at }}
          RUN_FINISHED: ${{ github.event.repository.updated_at }}
          ERROR_SUMMARY: "Quick check failed. Check workflow logs for details."
