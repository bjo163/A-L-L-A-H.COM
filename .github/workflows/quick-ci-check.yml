name: Quick CI Health Check

# Routine validation is owned by CI Validation Gate & Promotion. This manual
# workflow remains available for ad hoc diagnostics without duplicate runs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick-check:
    name: Manual Quick Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint:arch
      - run: pnpm ui:test
      - run: pnpm ui:contrast
