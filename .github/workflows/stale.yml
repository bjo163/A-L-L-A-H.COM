name: Stale Issue/PR Management

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM Jakarta
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark Stale Issues/PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had recent activity.
            It will be closed in 7 days if no further activity occurs.
            If this issue is still relevant, please add a comment or update the issue.
          stale-pr-message: >
            This PR has been automatically marked as stale because it has not had recent activity.
            It will be closed in 7 days if no further activity occurs.
            If this PR is still relevant, please add a comment or push new commits.
          close-issue-message: >
            This issue was closed because it was stale for 7 days with no activity.
            Feel free to reopen if this is still relevant.
          close-pr-message: >
            This PR was closed because it was stale for 7 days with no activity.
            Feel free to reopen if this is still relevant.
          days-before-stale: 30
          days-before-close: 7
          exempt-all-milestones: true
          exempt-all-assignees: false
          exempt-labels: 'pinned,blocked,security,bug,urgent'
          stale-label: 'stale'
          operations-per-run: 50
