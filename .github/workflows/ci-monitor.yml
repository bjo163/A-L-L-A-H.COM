name: CI Monitor & Auto-Fix

on:
  workflow_run:
    workflows: ["CI Validation Gate & Promotion"]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Monitor CI & Auto-Fix
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only this job pushes auto-fixes, so only it holds write permissions.
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Auto-fix pushes must re-trigger CI; GITHUB_TOKEN pushes do not,
          # so this job needs the PAT when it is configured.
          token: ${{ secrets.GH_TOKEN || github.token }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI Monitor Check
        id: monitor
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          CI_MONITOR_RUN_ID: ${{ github.event.workflow_run.id }}
        # continue-on-error: the monitor itself failing (e.g. API hiccup) must
        # not look like a repo problem; downstream steps act on git state.
        continue-on-error: true
        run: pnpm tsx scripts/ci-automation/monitor.mts --check

      - name: Check if fixes were applied
        id: fixes
        if: always()
        run: |
          if git status --porcelain | grep -q .; then
            echo "fixes_applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "fixes_applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and Push Fixes
        if: steps.fixes.outputs.fixes_applied == 'true'
        run: |
          git config user.name "CI Auto-Fix Bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git commit -m "fix: auto-fix CI errors [skip ci]"
          git push origin HEAD:dev

      - name: Notify on Unfixable Failures
        if: failure()
        run: |
          echo "::warning::CI Monitor detected unfixable failures. Manual intervention required."
