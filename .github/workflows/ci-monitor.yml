name: CI Monitor & Auto-Fix

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches: [dev] # Also run on push to dev

permissions:
  contents: write # Need write to push fixes
  actions: read   # Need read to check workflow runs

jobs:
  monitor:
    name: Monitor CI & Auto-Fix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '12'
          run_install: false
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run CI Monitor Check
        id: monitor
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          node scripts/ci-automation/monitor.js --check
        continue-on-error: true
      
      - name: Check if fixes were applied
        if: always()
        run: |
          if git status --porcelain | grep -q .; then
            echo "fixes_applied=true" >> $GITHUB_OUTPUT
          else
            echo "fixes_applied=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and Push Fixes
        if: steps.monitor.outputs.fixes_applied == 'true'
        run: |
          git config user.name "CI Auto-Fix Bot"
          git config user.email "ci-bot@a-l-l-a-h.com"
          git add -A
          git commit -m "fix: auto-fix CI errors [skip ci]"
          git push origin dev
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      
      - name: Notify on Unfixable Failures
        if: failure()
        run: |
          echo "::warning::CI Monitor detected unfixable failures. Manual intervention required."
          # Could add Slack/Discord webhook here
          # curl -X POST -H 'Content-type: application/json' --data '{"text":"CI Monitor: Unfixable failures detected"}' $SLACK_WEBHOOK

  # Also run on every push to dev for immediate feedback
  quick-check:
    name: Quick CI Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      
      - uses: pnpm/action-setup@v4
        with:
          version: '12'
          run_install: false
      
      - run: pnpm install --frozen-lockfile
      
      - name: Quick TypeCheck
        run: pnpm typecheck
        continue-on-error: true
      
      - name: Quick Lint
        run: pnpm lint:arch
        continue-on-error: true
      
      - name: Quick Build (gate)
        run: pnpm --filter @moonwitness/gate build
        continue-on-error: true
