name: Publish production images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate-compose:
    name: Validate production Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        # docker-compose.yml fails closed on missing secrets (`:?` interpolation).
        # Validation only checks the topology, so throwaway placeholder material
        # is sufficient — it never reaches a built image or a real deployment.
        env:
          JWT_SECRET: compose-validation-placeholder-not-a-real-secret
          ARSY_MASTER_KEY: compose-validation-placeholder-not-a-real-secret
          BETTER_AUTH_URL: https://arsy.example.com
          BETTER_AUTH_SECRET: compose-validation-placeholder-not-a-real-secret
          CORS_ORIGINS: https://example.com
        run: docker compose config --quiet

  validate-docker-contracts:
    name: Validate Docker build contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate every app Docker contract
        run: node scripts/check-docker-contracts.mjs

  validate-platform-contracts:
    name: Validate platform contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate topology, runtime, CI, API, and release contracts
        run: pnpm platform:contract:check

      - name: Validate unit API and model contracts
        run: pnpm contract:check

      - name: Validate documentation contracts
        run: pnpm docs:check

      - name: Validate architecture invariants
        run: pnpm lint:arch

      - name: Validate ORM model and persistence contracts
        run: pnpm --filter @allah/arsy-orm test

  publish:
    name: Publish ${{ matrix.component }} image
    runs-on: ubuntu-latest
    needs: [validate-compose, validate-docker-contracts, validate-platform-contracts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: arsy
            dockerfile: apps/arsy/Dockerfile
          - component: gate
            dockerfile: apps/gate/Dockerfile
          - component: dock
            dockerfile: apps/dock/Dockerfile
          - component: headquarter
            dockerfile: apps/headquarter/Dockerfile
          - component: id
            dockerfile: apps/id/Dockerfile
          - component: jizz
            dockerfile: apps/jizz/Dockerfile
          - component: sentinel
            dockerfile: apps/sentinel/Dockerfile
          - component: harbor
            dockerfile: apps/harbor/Dockerfile
          - component: moonsky
            dockerfile: apps/moonsky/Dockerfile
          - component: e-isp
            dockerfile: apps/e-isp/Dockerfile
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        shell: bash
        run: |
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${repository}-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  release:
    name: Create GitHub release after image publish
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Check out published source
        uses: actions/checkout@v7

      - name: Create versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          # package.json version rarely bumps per release, so a plain v<version>
          # tag collides after the first run and releases silently stop. Derive a
          # unique tag from the run counter, falling back to the run id.
          suffix="${GITHUB_RUN_NUMBER:-$GITHUB_RUN_ID}"
          tag="v${version}-run${suffix}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping."
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "A-L-L-A-H.COM $tag" \
              --generate-notes
          fi
