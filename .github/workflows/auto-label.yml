name: Auto-label PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-label:
    name: Auto-label PR based on files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            
            const labels = new Set();
            
            for (const file of files) {
              const filename = file.filename;
              
              // App labels
              if (filename.startsWith('apps/gate/')) labels.add('app:gate');
              if (filename.startsWith('apps/dock/')) labels.add('app:dock');
              if (filename.startsWith('apps/headquarter/')) labels.add('app:headquarter');
              if (filename.startsWith('apps/id/')) labels.add('app:id');
              if (filename.startsWith('apps/jizz/')) labels.add('app:jizz');
              if (filename.startsWith('apps/arsy/')) labels.add('app:arsy');
              if (filename.startsWith('apps/sentinel/')) labels.add('app:sentinel');
              
              // Package labels
              if (filename.startsWith('packages/ui/')) labels.add('pkg:ui');
              if (filename.startsWith('packages/sdk/')) labels.add('pkg:sdk');
              if (filename.startsWith('packages/types/')) labels.add('pkg:types');
              if (filename.startsWith('packages/lint/')) labels.add('pkg:lint');
              if (filename.startsWith('packages/arsy-orm/')) labels.add('pkg:arsy-orm');
              if (filename.startsWith('packages/arsy-plugin-')) labels.add('pkg:arsy-plugin');
              if (filename.startsWith('packages/vscode-extension/')) labels.add('pkg:vscode-ext');
              
              // Config/CI
              if (filename.startsWith('.github/workflows/')) labels.add('ci');
              if (filename.startsWith('.github/')) labels.add('github');
              if (filename === 'docker-compose.yml' || filename.startsWith('Dockerfile')) labels.add('docker');
              if (filename === 'pnpm-workspace.yaml' || filename === 'package.json' || filename === 'pnpm-lock.yaml') labels.add('deps');
              if (filename === 'tsconfig.base.json' || filename === 'eslint.config.mjs') labels.add('config');
              
              // Documentation
              if (filename.startsWith('docs/') || filename.endsWith('.md')) labels.add('docs');
              
              // Scripts
              if (filename.startsWith('scripts/') || filename.startsWith('.husky/')) labels.add('scripts');
              
              // Tests
              if (filename.includes('.test.') || filename.includes('.spec.')) labels.add('test');
            }
            
            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: Array.from(labels)
              });
            }
