name: CI Failure -> GitHub Issue

on:
  workflow_run:
    workflows:
      - "CI"           # Ganti dengan nama workflow CI utama kamu
      - "Build"        # Atau workflow build
      - "TypeCheck"    # Atau workflow typecheck
    types:
      - completed
    branches:
      - dev
      - main

permissions:
  contents: read
  issues: write        # Butuh permission untuk create issue
  pull-requests: read

jobs:
  create-issue-on-failure:
    name: Create Issue on CI Failure
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Get workflow run details
        id: run_info
        run: |
          echo "run_id=${{ github.event.workflow_run.id }}" >> $GITHUB_OUTPUT
          echo "run_url=${{ github.event.workflow_run.html_url }}" >> $GITHUB_OUTPUT
          echo "workflow_name=${{ github.event.workflow_run.name }}" >> $GITHUB_OUTPUT
          echo "branch=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_OUTPUT
          echo "commit_sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          echo "commit_url=https://github.com/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          echo "run_started=${{ github.event.workflow_run.run_started_at }}" >> $GITHUB_OUTPUT
          echo "run_finished=${{ github.event.workflow_run.updated_at }}" >> $GITHUB_OUTPUT
      
      - name: Download failed job logs
        id: logs
        uses: actions/download-artifact@v4
        with:
          name: logs
          path: ./logs
        continue-on-error: true
      
      - name: Extract error summary
        id: error_summary
        run: |
          # Coba ambil log dari workflow run API
          ERROR_SUMMARY=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ steps.run_info.outputs.run_id }}/jobs" \
            | jq -r '.jobs[] | select(.conclusion == "failure") | "## Job: \(.name)\n\(.steps[] | select(.conclusion == "failure") | "### Step: \(.name)\n\(.conclusion)\n")"' 2>/dev/null | head -c 3000 || echo "Could not fetch detailed logs")
          
          # Escape untuk JSON
          ERROR_SUMMARY_ESCAPED=$(echo "$ERROR_SUMMARY" | jq -Rs .)
          echo "summary=$ERROR_SUMMARY_ESCAPED" >> $GITHUB_OUTPUT
      
      - name: Check for existing open issue
        id: existing_issue
        run: |
          EXISTING=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/issues?state=open&labels=ci-failure,auto-created" \
            | jq -r '.[] | select(.title | contains("'${{ steps.run_info.outputs.workflow_name }}'")) | select(.title | contains("'${{ steps.run_info.outputs.branch }}'")) | .number' | head -1)
          
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "issue_number=$EXISTING" >> $GITHUB_OUTPUT
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create new issue
        if: steps.existing_issue.outputs.exists == 'false'
        uses: peter-evans/create-issue-from-file@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "[CI Failure] ${{ steps.run_info.outputs.workflow_name }} failed on ${{ steps.run_info.outputs.branch }}"
          content-filepath: .github/issue-templates/ci-failure.md
          labels: |
            ci-failure
            auto-created
            branch:${{ steps.run_info.outputs.branch }}
          assignees: |
        env:
          WORKFLOW_NAME: ${{ steps.run_info.outputs.workflow_name }}
          RUN_URL: ${{ steps.run_info.outputs.run_url }}
          BRANCH: ${{ steps.run_info.outputs.branch }}
          COMMIT_SHA: ${{ steps.run_info.outputs.commit_sha }}
          COMMIT_URL: ${{ steps.run_info.outputs.commit_url }}
          RUN_STARTED: ${{ steps.run_info.outputs.run_started }}
          RUN_FINISHED: ${{ steps.run_info.outputs.run_finished }}
          ERROR_SUMMARY: ${{ steps.error_summary.outputs.summary }}
      
      - name: Update existing issue
        if: steps.existing_issue.outputs.exists == 'true'
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.existing_issue.outputs.issue_number }}/comments" \
            -d '{
              "body": "## 🔄 New Failure Detected\n\n**Workflow:** '${{ steps.run_info.outputs.workflow_name }}'\n**Branch:** '${{ steps.run_info.outputs.branch }}'\n**Commit:** ['${{ steps.run_info.outputs.commit_sha }}']('${{ steps.run_info.outputs.commit_url }}')\n**Run:** ['View Logs']('${{ steps.run_info.outputs.run_url }}')\n**Time:** '${{ steps.run_info.outputs.run_finished }}'\n\n---\n\n${{ steps.error_summary.outputs.summary }}"
            }'
            # Reopen if closed
          curl -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.existing_issue.outputs.issue_number }}" \
            -d '{"state": "open"}'

      - name: Add failure run link to issue
        if: steps.existing_issue.outputs.exists == 'true'
        run: |
          curl -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.existing_issue.outputs.issue_number }}" \
            -d '{
              "labels": ["ci-failure", "auto-created", "branch:${{ steps.run_info.outputs.branch }}", "recurring"]
            }'
